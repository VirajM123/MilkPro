name: MilkPro

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_saver: ^0.4.0
  pdf: ^3.11.3
  printing: ^5.14.3
  url_launcher: ^6.3.2
  http: ^1.6.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/logo.png"
  min_sdk_android: 21
